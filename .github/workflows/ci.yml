name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Check formatting
        run: npm run format:check
      - name: Test with coverage
        run: npm run test:coverage
      - name: Upload coverage
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: frontendCoverage
          path: frontend/coverage
          if-no-files-found: ignore
          retention-days: 14

  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: |
          python -m venv backend/.venv
          backend/.venv/bin/python -m pip install --disable-pip-version-check -r backend/requirements.txt
      - name: Test with coverage
        working-directory: backend
        run: .venv/bin/python -m pytest --cov --cov-report=term-missing --cov-report=json --cov-report=html
      - name: Upload coverage
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: backendCoverage
          path: backend/coverage
          if-no-files-found: ignore
          retention-days: 14

  testAgentTooling:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install TypeScript and Prettier from the frontend lockfile
        run: npm ci --prefix frontend --no-audit --no-fund
      - name: Test hook, skill scripts and workflow scripts
        run: npm --prefix .github/testAgent test
      - name: Typecheck
        run: npm --prefix .github/testAgent run typecheck
      - name: Check formatting
        run: npm --prefix .github/testAgent run formatCheck
