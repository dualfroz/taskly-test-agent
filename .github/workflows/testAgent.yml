name: testAgent

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions: {}

concurrency:
  group: testAgent-${{ github.event.pull_request.number }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  plan:
    if: >-
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]' &&
      !contains(github.event.pull_request.labels.*.name, 'skip-test-agent')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      shouldRun: ${{ steps.decide.outputs.shouldRun }}
      hasCredentials: ${{ steps.decide.outputs.hasCredentials }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Compute change set
        env:
          baseSha: ${{ github.event.pull_request.base.sha }}
          headSha: ${{ github.event.pull_request.head.sha }}
        run: |
          mkdir -p .testAgent
          node .claude/skills/analyze-pr-changes/scripts/changeSet.ts files --base "$baseSha" --head "$headSha" > .testAgent/changeSet.json
      - name: Decide whether the agent runs
        id: decide
        env:
          headSha: ${{ github.event.pull_request.head.sha }}
          hasApiKey: ${{ secrets.ANTHROPIC_API_KEY != '' }}
          hasOauthToken: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
        run: |
          frontendCandidates=$(jq '.testCandidates.frontend' .testAgent/changeSet.json)
          backendCandidates=$(jq '.testCandidates.backend' .testAgent/changeSet.json)
          agentTrailer=$(git log -1 --format='%(trailers:key=Test-Agent,valueonly)' "$headSha")
          shouldRun=true
          if [ "$agentTrailer" = "true" ]; then
            shouldRun=false
            reason="the head commit was created by the test agent"
          elif [ "$frontendCandidates" -eq 0 ] && [ "$backendCandidates" -eq 0 ]; then
            shouldRun=false
            reason="no changed frontend or backend source file is a test candidate"
          else
            reason="$frontendCandidates frontend and $backendCandidates backend source files are test candidates"
          fi
          hasCredentials=false
          if [ "$hasApiKey" = "true" ] || [ "$hasOauthToken" = "true" ]; then
            hasCredentials=true
          fi
          {
            echo "shouldRun=$shouldRun"
            echo "hasCredentials=$hasCredentials"
          } >> "$GITHUB_OUTPUT"
          {
            echo "### Unit test agent plan"
            echo
            echo "Run the agent: $shouldRun ($reason). Credentials configured: $hasCredentials."
          } >> "$GITHUB_STEP_SUMMARY"

  agent:
    needs: plan
    if: needs.plan.outputs.shouldRun == 'true' && needs.plan.outputs.hasCredentials == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    outputs:
      baseline: ${{ steps.baseline.outcome }}
      hasPatch: ${{ steps.patch.outputs.hasPatch }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install project dependencies
        run: |
          npm ci --prefix frontend --no-audit --no-fund
          python -m venv backend/.venv
          backend/.venv/bin/python -m pip install --disable-pip-version-check -r backend/requirements.txt
      - name: Install Claude Code
        run: npm install --global --no-audit --no-fund @anthropic-ai/claude-code@2.1.293
      - name: Compute change set
        env:
          baseSha: ${{ github.event.pull_request.base.sha }}
          headSha: ${{ github.event.pull_request.head.sha }}
        run: |
          mkdir -p .testAgent
          node .claude/skills/analyze-pr-changes/scripts/changeSet.ts files --base "$baseSha" --head "$headSha" > .testAgent/changeSet.json
      - name: Measure baseline coverage
        id: baseline
        continue-on-error: true
        run: node .claude/skills/run-and-verify-tests/scripts/runTests.ts all --coverage --out .testAgent/baseline
      - name: Upload baseline
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: testAgentBaseline
          path: |
            .testAgent/changeSet.json
            .testAgent/baseline/summary.json
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 14
      - name: Build prompt
        if: steps.baseline.outcome == 'success'
        env:
          baseSha: ${{ github.event.pull_request.base.sha }}
          headSha: ${{ github.event.pull_request.head.sha }}
          maxTurns: ${{ vars.TEST_AGENT_MAX_TURNS || '80' }}
        run: node .github/testAgent/buildPrompt.ts pr --base "$baseSha" --head "$headSha" --maxTurns "$maxTurns" > .testAgent/prompt.md
      - name: Run unit-test-agent
        id: agent
        if: steps.baseline.outcome == 'success'
        timeout-minutes: 30
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          model: ${{ vars.TEST_AGENT_MODEL || 'claude-sonnet-5-5' }}
          maxTurns: ${{ vars.TEST_AGENT_MAX_TURNS || '80' }}
          maxBudgetUsd: ${{ vars.TEST_AGENT_MAX_BUDGET_USD || '5' }}
        run: |
          [ -n "$ANTHROPIC_API_KEY" ] || unset ANTHROPIC_API_KEY
          [ -n "$CLAUDE_CODE_OAUTH_TOKEN" ] || unset CLAUDE_CODE_OAUTH_TOKEN
          set +e
          claude -p "$(cat .testAgent/prompt.md)" \
            --agent unit-test-agent \
            --permission-mode dontAsk \
            --setting-sources project \
            --settings .claude/testAgent.settings.json \
            --strict-mcp-config \
            --no-session-persistence \
            --model "$model" \
            --max-turns "$maxTurns" \
            --max-budget-usd "$maxBudgetUsd" \
            --output-format json \
            --json-schema "$(cat .claude/skills/test-report/report.schema.json)" \
            > .testAgent/agentOutput.json 2> .testAgent/agentStderr.log
          agentExitCode=$?
          echo "Claude Code exited with $agentExitCode"
          if jq -e '.is_error == false and .structured_output != null' .testAgent/agentOutput.json > /dev/null 2>&1; then
            echo "succeeded=true" >> "$GITHUB_OUTPUT"
          else
            echo "succeeded=false" >> "$GITHUB_OUTPUT"
          fi
          jq -r '"subtype=\(.subtype) turns=\(.num_turns) cost=\(.total_cost_usd)"' .testAgent/agentOutput.json || true
      - name: Collect agent changes
        id: patch
        if: steps.agent.outcome == 'success'
        env:
          agentSucceeded: ${{ steps.agent.outputs.succeeded }}
        run: |
          git add --all -- .
          git diff --cached --binary HEAD > .testAgent/agent.patch
          if [ -s .testAgent/agent.patch ] && [ "$agentSucceeded" = "true" ]; then
            echo "hasPatch=true" >> "$GITHUB_OUTPUT"
          else
            echo "hasPatch=false" >> "$GITHUB_OUTPUT"
          fi
          git diff --cached --stat HEAD
      - name: Upload agent results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: testAgentRun
          path: |
            .testAgent/prompt.md
            .testAgent/agentOutput.json
            .testAgent/agentStderr.log
            .testAgent/agent.patch
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 14

  verify:
    needs: [plan, agent]
    if: needs.agent.outputs.hasPatch == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    outputs:
      paths: ${{ steps.paths.outcome }}
      typecheck: ${{ steps.typecheck.outcome }}
      format: ${{ steps.format.outcome }}
      suites: ${{ steps.suites.outcome }}
      stability: ${{ steps.stability.outcome }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Download agent results and baseline
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: testAgent*
          path: .testAgent
          merge-multiple: true
      - name: Check changed paths
        id: paths
        continue-on-error: true
        run: |
          mkdir -p .testAgent/logs
          if ! node .github/testAgent/verifyPaths.ts --patch .testAgent/agent.patch > .testAgent/verification.json; then
            jq -r '.violations[] | "\(.rule) \(.path): \(.detail)"' .testAgent/verification.json | tee .testAgent/logs/paths.log
            exit 1
          fi
          git apply .testAgent/agent.patch
          git status --short
      - name: Install project dependencies
        if: steps.paths.outcome == 'success'
        run: |
          npm ci --prefix frontend --no-audit --no-fund
          python -m venv backend/.venv
          backend/.venv/bin/python -m pip install --disable-pip-version-check -r backend/requirements.txt
      - name: Typecheck
        id: typecheck
        if: steps.paths.outcome == 'success'
        continue-on-error: true
        run: node .claude/skills/run-and-verify-tests/scripts/runTests.ts typecheck 2>&1 | tee .testAgent/logs/typecheck.log
      - name: Check formatting of changed frontend files
        id: format
        if: steps.paths.outcome == 'success'
        continue-on-error: true
        run: |
          mapfile -t frontendFiles < <(jq -r '.files[] | select(.status != "deleted") | .path | select(startswith("frontend/"))' .testAgent/verification.json)
          if [ "${#frontendFiles[@]}" -eq 0 ]; then
            echo "No frontend files changed."
            exit 0
          fi
          node .claude/skills/run-and-verify-tests/scripts/runTests.ts format --check "${frontendFiles[@]}" 2>&1 | tee .testAgent/logs/format.log
      - name: Run full suites with coverage
        id: suites
        if: steps.paths.outcome == 'success'
        continue-on-error: true
        run: node .claude/skills/run-and-verify-tests/scripts/runTests.ts all --coverage --out .testAgent/after 2>&1 | tee .testAgent/logs/suites.log
      - name: Rerun changed tests shuffled and in shifted time zones
        id: stability
        if: steps.paths.outcome == 'success'
        continue-on-error: true
        run: |
          mapfile -t frontendFiles < <(jq -r '.changedTestFiles.frontend[]' .testAgent/verification.json)
          mapfile -t backendFiles < <(jq -r '.changedTestFiles.backend[]' .testAgent/verification.json)
          {
            status=0
            if [ "${#frontendFiles[@]}" -gt 0 ]; then
              node .claude/skills/run-and-verify-tests/scripts/runTests.ts frontend --repeat 3 "${frontendFiles[@]}" || status=1
            fi
            if [ "${#backendFiles[@]}" -gt 0 ]; then
              node .claude/skills/run-and-verify-tests/scripts/runTests.ts backend --repeat 3 "${backendFiles[@]}" || status=1
            fi
            exit "$status"
          } 2>&1 | tee .testAgent/logs/stability.log
      - name: Compute coverage delta
        if: steps.suites.outcome == 'success' || steps.suites.outcome == 'failure'
        continue-on-error: true
        run: |
          node .github/testAgent/coverageDelta.ts \
            --before .testAgent/baseline/summary.json \
            --after .testAgent/after/summary.json \
            --changeSet .testAgent/changeSet.json > .testAgent/coverageDelta.json
      - name: Upload verification
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: testAgentVerification
          path: |
            .testAgent/verification.json
            .testAgent/coverageDelta.json
            .testAgent/after/summary.json
            .testAgent/logs
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 14
      - name: Fail when verification failed
        env:
          paths: ${{ steps.paths.outcome }}
          typecheck: ${{ steps.typecheck.outcome }}
          format: ${{ steps.format.outcome }}
          suites: ${{ steps.suites.outcome }}
          stability: ${{ steps.stability.outcome }}
        run: |
          echo "paths=$paths typecheck=$typecheck format=$format suites=$suites stability=$stability"
          [ "$paths" = "success" ] && [ "$typecheck" = "success" ] && [ "$format" = "success" ] \
            && [ "$suites" = "success" ] && [ "$stability" = "success" ]

  publish:
    needs: [plan, agent, verify]
    if: ${{ !cancelled() && needs.plan.outputs.shouldRun == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Download run artifacts
        if: needs.agent.result != 'skipped'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: testAgent*
          path: .testAgent
          merge-multiple: true
      - name: Commit and push verified tests
        id: push
        if: needs.verify.result == 'success'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          headRef: ${{ github.event.pull_request.head.ref }}
          runUrl: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          git apply --index .testAgent/agent.patch
          git -c user.name='github-actions[bot]' \
            -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit --quiet \
            -m 'test: add unit tests for changed code' \
            -m "Created and verified by the unit-test-agent workflow: $runUrl" \
            --trailer 'Test-Agent: true'
          basicAuth=$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)
          echo "::add-mask::$basicAuth"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $basicAuth" \
            push origin "HEAD:refs/heads/$headRef"
          echo "commitSha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Run CI on the pushed commit
        if: steps.push.outcome == 'success'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          headRef: ${{ github.event.pull_request.head.ref }}
        run: gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref "$headRef"
      - name: Render report
        if: ${{ !cancelled() }}
        env:
          credentials: ${{ needs.plan.outputs.hasCredentials == 'true' && 'present' || 'missing' }}
          baseline: ${{ needs.agent.outputs.baseline }}
          pathsOutcome: ${{ needs.verify.outputs.paths }}
          typecheckOutcome: ${{ needs.verify.outputs.typecheck }}
          formatOutcome: ${{ needs.verify.outputs.format }}
          suitesOutcome: ${{ needs.verify.outputs.suites }}
          stabilityOutcome: ${{ needs.verify.outputs.stability }}
          pushOutcome: ${{ steps.push.outcome }}
          commitSha: ${{ steps.push.outputs.commitSha }}
          headSha: ${{ github.event.pull_request.head.sha }}
          runUrl: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          model: ${{ vars.TEST_AGENT_MODEL || 'claude-sonnet-5-5' }}
        run: |
          mkdir -p .testAgent
          node .github/testAgent/renderReport.ts \
            --credentials "$credentials" \
            --baseline "$baseline" \
            --agentOutput .testAgent/agentOutput.json \
            --verification .testAgent/verification.json \
            --coverageDelta .testAgent/coverageDelta.json \
            --check "paths=$pathsOutcome" \
            --check "typecheck=$typecheckOutcome" \
            --check "format=$formatOutcome" \
            --check "suites=$suitesOutcome" \
            --check "stability=$stabilityOutcome" \
            --push "$pushOutcome" \
            --commit "$commitSha" \
            --headSha "$headSha" \
            --runUrl "$runUrl" \
            --model "$model" \
            --logs .testAgent/logs > .testAgent/comment.md
          cat .testAgent/comment.md >> "$GITHUB_STEP_SUMMARY"
      - name: Publish sticky pull request comment
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
          prNumber: ${{ github.event.pull_request.number }}
        run: |
          commentId=$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$prNumber/comments" \
            --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | startswith("<!-- test-agent-report -->"))) | .id' | head -n 1)
          if [ -n "$commentId" ]; then
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$commentId" -F body=@.testAgent/comment.md > /dev/null
          else
            gh api --method POST "repos/$GITHUB_REPOSITORY/issues/$prNumber/comments" -F body=@.testAgent/comment.md > /dev/null
          fi
